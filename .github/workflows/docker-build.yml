name: Build & Push Docker image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "prisma.config.ts"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nulp-ai-enterprise/personal-crm
  # Dummy value — the typecheck job only needs prisma generate / next typegen
  # to resolve types, never an actual database connection.
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next typegen
      - run: npx tsc --noEmit

  build-and-push:
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      contents: write # щоб писати в deployment.yaml
      packages: write # щоб пушити в GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}-migrator:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin image SHA in deployment.yaml
        run: |
          TAG="${{ steps.meta.outputs.sha_tag }}"
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${TAG}|g" k8s/deployment.yaml
          sed -i "s|image: ${{ env.IMAGE }}-migrator:.*|image: ${{ env.IMAGE }}-migrator:${TAG}|g" k8s/deployment.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: pin image to ${TAG} [skip ci]"
          git push
