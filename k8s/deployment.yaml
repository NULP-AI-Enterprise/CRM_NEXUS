apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-crm
  namespace: personal-crm
  labels:
    app: personal-crm
spec:
  replicas: 1
  strategy:
    type: Recreate # single-replica app in front of one Postgres — never run two versions at once
  selector:
    matchLabels:
      app: personal-crm
  template:
    metadata:
      labels:
        app: personal-crm
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - |
              until pg_isready -h personal-crm-postgres -U "$POSTGRES_USER" -d personal_crm; do
                echo "waiting for postgres..."
                sleep 3
              done
          # 60 x 3s = up to 3 minutes for Postgres to come up on first install
          # (implemented as a loop above rather than failureThreshold, since this is a
          # command, not a probe)
        - name: migrate
          # CI automatically updates this tag after each push (see .github/workflows/docker-build.yml)
          image: ghcr.io/nulp-ai-enterprise/personal-crm-migrator:sha-8ac321b
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: DATABASE_URL
      containers:
        - name: personal-crm
          image: ghcr.io/nulp-ai-enterprise/personal-crm:sha-8ac321b
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: AUTH_URL
              value: "https://personal-crm.thesis-i.com"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: OPENAI_API_KEY
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: AUTH_SECRET
            - name: APP_URL
              value: "https://personal-crm.thesis-i.com"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: personal-crm-secret
                  key: SMTP_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 12 # 12×10s = 2 хв на старт
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-pull-secret # існує в кожному namespace — створити вручну один раз
