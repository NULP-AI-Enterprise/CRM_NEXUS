# Template — copy to k8s/secret.yaml (gitignored), fill in real values, then seal:
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   $EDITOR k8s/secret.yaml
#   kubectl config set-cluster nulp-k8s-2 --server=https://100.107.206.16:6443
#   kubeseal --format yaml --controller-name=sealed-secrets-controller \
#     --controller-namespace=kube-system < k8s/secret.yaml > k8s/sealed-secret.yaml
#
# Commit only k8s/sealed-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: personal-crm-secret
  namespace: personal-crm
type: Opaque
stringData:
  # Must stay in sync with POSTGRES_USER / POSTGRES_PASSWORD below.
  DATABASE_URL: "postgresql://personal_crm:CHANGE_ME@personal-crm-postgres.personal-crm.svc.cluster.local:5432/personal_crm?schema=public"
  POSTGRES_USER: "personal_crm"
  POSTGRES_PASSWORD: "CHANGE_ME"
  # https://platform.openai.com/api-keys
  OPENAI_API_KEY: "sk-CHANGE_ME"
  # Generate with: npx auth secret   (or: openssl rand -base64 32)
  AUTH_SECRET: "CHANGE_ME"
  # SMTP for email verification. For Gmail: use an App Password, not the
  # account password — https://myaccount.google.com/apppasswords
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
